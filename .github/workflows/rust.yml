name: Rust prototype validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native GPE prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Resolve provisional dependency lock
        run: cargo generate-lockfile
      - name: Export provisional lockfile for reproducibility fix
        run: |
          echo '__ARCHIVES_LOCK_START__'
          cat Cargo.lock
          echo '__ARCHIVES_LOCK_END__'
      - name: Formatting all Rust sources
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --locked --all-targets
      - name: Unit tests for all targets
        run: cargo test --locked --all-targets
      - name: Clippy all targets and all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Diff hygiene
        run: git diff --check
