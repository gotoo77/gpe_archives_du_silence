name: Rust prototype validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native GPE prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libasound2-dev libxkbcommon-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --all-targets
      - name: Unit tests
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
